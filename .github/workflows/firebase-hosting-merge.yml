name: Deploy to Meetcatch Landing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets are masked in logs. Never use `vars.*` for tokens (variables are plain text).
      NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      NEXT_PUBLIC_BRANCH: ${{ github.ref_name }}
      NEXT_PUBLIC_TINA_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Check required secrets
        run: |
          missing=0
          [ -z "$NEXT_PUBLIC_TINA_CLIENT_ID" ] && echo "::error::Secret NEXT_PUBLIC_TINA_CLIENT_ID is not set" && missing=1
          [ -z "$TINA_TOKEN" ] && echo "::error::Secret TINA_TOKEN is not set" && missing=1
          [ -z "$FIREBASE_SA" ] && echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set" && missing=1
          exit $missing
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: npm ci

      # build:tina runs `tinacms build` AND `next build` (see scripts/build-tina.mjs),
      # so a second `npm run build` is not needed.
      - name: Build Tina CMS admin + Next.js site
        run: npm run build:tina

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: v3deeplinks
